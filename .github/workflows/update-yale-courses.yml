# Keeps the courses from the rest of Yale (every school except SOM) in sync.
# Once a day: ask Yale's Courses Web Service (with the YALE_API_KEY secret) and
# Law's public course list, and if anything changed, commit the new
# docs/data-samples/yale_courses_<term>.csv files to main (Vercel republishes).
# Run it by hand from the GitHub "Actions" tab → "Update Yale courses" → "Run workflow".
# Full notes: docs/updating-course-data.md
name: Update Yale courses

on:
  schedule:
    - cron: '47 9 * * *' # once a day (UTC), early morning in New Haven
  workflow_dispatch:

permissions:
  contents: write # commit the updated course files
  actions: write # keep this schedule from being paused (see the last step)

concurrency:
  group: update-courses # same group as the SOM update, so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Save safe updates even if a term or the Course Search health check fails.
      # Report the failure after testing and publishing any valid changes.
      - name: Fetch courses from Yale
        id: fetch
        continue-on-error: true
        env:
          YALE_API_KEY: ${{ secrets.YALE_API_KEY }}
        run: npm run update-yale-courses -- --summary-file "$RUNNER_TEMP/summary.txt"

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain -- docs/data-samples | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Never publish course files that break the tests or the build.
      - name: Test and build
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data-samples
          summary="$(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo 'course details updated')"
          git commit -m "chore(courses): update other Yale schools — $summary"
          git pull --rebase
          git push

      # GitHub pauses scheduled jobs in public repos after 60 days without
      # activity (e.g. a quiet summer). Re-enabling the workflow resets that clock.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-yale-courses.yml/enable"

      - name: Report update or source failures
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The Yale update found a data source problem. Open the 'Fetch courses from Yale' step above for details."
          exit 1

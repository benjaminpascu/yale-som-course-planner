# TEMPORARY (feature/cross-registration only): checks that Yale's course API and
# Law's public course site answer from GitHub's servers. Remove before merging.
name: Probe course sources

on:
  push:
    branches: [feature/cross-registration]
    paths: [.github/workflows/probe-sources.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yale API and Law site
        env:
          YALE_API_KEY: ${{ secrets.YALE_API_KEY }}
        run: |
          node --input-type=module -e '
          const key = process.env.YALE_API_KEY;
          if (!key) { console.log("YALE_API_KEY secret is missing"); process.exit(1); }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let yale = 0, status = 0;
          for (let i = 0; i < 6 && !yale; i++) {
            const r = await fetch(`https://gw.its.yale.edu/soa-gateway/courses/webservice/v3/index?apikey=${encodeURIComponent(key)}&subjectCode=GLBL&termCode=202701&school=GB&mode=json`);
            status = r.status;
            const d = await r.json().catch(() => []);
            yale = Array.isArray(d) ? d.length : 0;
            await sleep(1000);
          }
          console.log(`Yale API: HTTP ${status}, ${yale} Jackson courses`);
          const law = await fetch("https://courses.law.yale.edu/moduleservices/moduleinfo");
          console.log(`Law site: HTTP ${law.status}`);
          if (!yale || !law.ok) process.exit(1);
          '
